<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Clean white rounded canvas -->
  <rect width="512" height="512" rx="112" fill="#ffffff" />

  <g transform="translate(0, 6)">
    <!-- 1. Sleek Modern Awning / Roof Bar -->
    <rect x="160" y="88" width="192" height="14" rx="7" fill="#09090b" />

    <!-- 2. Modern 3-Panel Geometric Canopy -->
    <path d="M164 102 L172 178 C173 186 182 192 192 192 C202 192 210 186 212 178 L216 102 Z" fill="#09090b" />
    <path d="M216 102 L220 180 C222 188 232 194 244 194 H268 C280 194 290 188 292 180 L296 102 Z" fill="#09090b" />
    <path d="M296 102 L300 178 C302 186 310 192 320 192 C330 192 339 186 340 178 L348 102 Z" fill="#09090b" />
    <!-- Sleek subtle gap lines -->
    <line x1="216" y1="102" x2="216" y2="185" stroke="white" stroke-width="3" stroke-linecap="round" />
    <line x1="296" y1="102" x2="296" y2="185" stroke="white" stroke-width="3" stroke-linecap="round" />

    <!-- 3. Architectural Building Frame -->
    <path d="M172 192 V278 H156 C151.5 278 148 281.5 148 286 C148 290.5 151.5 294 156 294 H356 C360.5 294 364 290.5 364 286 C364 281.5 360.5 278 356 278 H340 V192" stroke="#09090b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- 4. Left: Entrance Doorway (Glass Arch Top) -->
    <path d="M188 284 V218 C188 209.16 195.16 202 204 202 H228 C236.84 202 244 209.16 244 218 V284" stroke="#09090b" stroke-width="6.5" stroke-linecap="round" fill="none" />

    <!-- Shopping Bag Motif inside door (Clean Minimalist Luxury Outline) -->
    <g transform="translate(201, 230)">
      <rect x="0" y="14" width="30" height="34" rx="6" stroke="#09090b" stroke-width="3" fill="none" />
      <path d="M8 14 V8 C8 4.68 10.68 2 14 2 H16 C19.32 2 22 4.68 22 8 V14" stroke="#09090b" stroke-width="3" stroke-linecap="round" fill="none" />
      <circle cx="15" cy="30" r="3" fill="#09090b" />
    </g>

    <!-- 5. Right: Window Display with POS Register Screen -->
    <rect x="258" y="202" width="76" height="52" rx="8" stroke="#09090b" stroke-width="6.5" fill="none" />
    
    <!-- Mini POS Terminal on the counter -->
    <g transform="translate(274, 212)">
      <rect x="0" y="0" width="44" height="28" rx="4" fill="#09090b" />
      <rect x="4" y="4" width="36" height="20" rx="2" fill="white" />
      <path d="M17 28 L14 34 H30 L27 28" fill="#09090b" />
      <rect x="8" y="8" width="14" height="3" rx="1.5" fill="#09090b" />
      <rect x="8" y="14" width="22" height="3" rx="1.5" fill="#71717a" />
    </g>

    <!-- Lower shelf / counter -->
    <rect x="258" y="264" width="76" height="20" rx="4" stroke="#09090b" stroke-width="6.5" fill="none" />

    <!-- 6. Custom Branding Typography: MY POS -->
    <text x="256" y="348" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="900" font-size="44" letter-spacing="4" fill="#09090b">MY POS</text>

    <!-- 7. Modern Minimalist Pill Badge: TOKO SERBA ADA -->
    <rect x="156" y="364" width="200" height="26" rx="13" fill="#09090b" />
    <text x="256" y="381.5" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="700" font-size="11.5" letter-spacing="2.5" fill="#ffffff">TOKO SERBA ADA</text>
  </g>
</svg>