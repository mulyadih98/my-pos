    <path d="M168 198 V276 H158 C153 276 149 280 149 285 C149 290 153 294 158 294 H354 C359 294 363 290 363 285 C363 280 359 276 354 276 H344 V198" stroke="#6e9360" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />

