    <!-- Canopy / Awning -->
    <!-- Scalloped path: width ~194 at bottom -->
    <path d="M176 102 C172 102 166 112 160 145 C156 168 152 186 164 195 C176 204 196 204 208 195 C220 204 240 204 252 195 C264 204 284 204 296 195 C308 204 328 204 340 195 C352 186 348 168 344 145 C338 112 332 102 328 102 Z" fill="#6e9360" stroke="#6e9360" stroke-width="5" stroke-linejoin="round" />
    
