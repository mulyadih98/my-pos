    <path d="M252 102 C252 135 252 165 252 195" stroke="white" stroke-width="4.5" stroke-linecap="round" />
    <path d="M296 102 C296 135 296 165 296 195" stroke="white" stroke-width="4.5" stroke-linecap="round" />

