      <path d="M15 17 H32 M17 23 H29 M22 13 V27" stroke-width="1.8" />
    </g>

    <!-- Right: Window Showcase -->
    <rect x="254" y="208" width="72" height="54" rx="4" stroke="#6e9360" stroke-width="7" fill="#6e9360" />
    <!-- Shelf below window -->
    <rect x="254" y="270" width="72" height="24" rx="3" stroke="#6e9360" stroke-width="7" fill="none" />

    <!-- BRAND TEXT: MY POS -->
    <!-- Drop Shadow Text -->
    <text x="256" y="347" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="42" letter-spacing="3" fill="#cddac9">MY POS</text>
    <!-- Main Text -->
    <text x="256" y="344" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="42" letter-spacing="3" fill="#6e9360">MY POS</text>

